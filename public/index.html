<html lang="es">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GOLDEN TOUCH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Concepto: vitrina de joyería en negro cálido con oro líquido. Una sola identidad (oscuro + oro) por decisión de marca. */
:root{
  --bg:#0a0908; --bg2:#0f0d0b; --surface:#120f0c; --surface2:#171410; --surface3:#201b14;
  --line:rgba(201,164,92,.16); --line2:rgba(201,164,92,.42);
  --gold:#c9a45c; --gold-hi:#ecd9a0; --gold-lo:#8a6a2b; --on-gold:#17110a;
  --ink:#f1eadb; --muted:#a39884;
  --ok:#74d69a; --warn:#f2b552; --bad:#f07a6c;
  --gold-grad:linear-gradient(115deg,#9a7b3c 0%,#ecd9a0 28%,#c9a45c 50%,#f4e6bd 64%,#a88743 100%);
  --f-display:'Cormorant Garamond','Garamond','Didot',Georgia,serif;
  --f-body:'Jost','Segoe UI',system-ui,sans-serif;
  --veil:rgba(10,9,8,.8);--shade:rgba(0,0,0,.5);--hdr:rgba(11,9,5,.86);--ovl:rgba(5,4,2,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:var(--fw,300);line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;
  background-image:radial-gradient(900px 480px at 50% -12%,rgba(201,164,92,.12),transparent 62%)}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.mx{max-width:1240px;margin:0 auto}
.gold-text{background:var(--gold-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.top .mx.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 0}
.top .mx.pbar{padding:14px 0}
.nl,.nr{display:flex;gap:18px;align-items:center}.nr{justify-content:flex-end}
.logo{cursor:pointer;border:0;padding:0;background:none;line-height:0;display:block}
.logo img{height:64px;width:auto;display:block;filter:drop-shadow(0 0 14px rgba(201,164,92,.25))}
.logo.sm img{height:46px}
[hidden]{display:none!important}
.was{text-decoration:line-through;color:var(--muted);font-size:13px;letter-spacing:.08em}
.pr{display:inline-flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center}
.offb{border:1px solid var(--gold);color:var(--gold-hi);font-size:11px;letter-spacing:.12em;padding:1px 7px}
.sale{position:absolute;left:0;top:14px;background:var(--gold-grad);color:var(--on-gold);padding:5px 14px;font-size:11px;font-weight:500;letter-spacing:.18em;z-index:2}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ann{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:var(--gold);color:var(--on-gold);text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;font-weight:500}
.herobtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.herobtns .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.trust{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 8px}
.trust>div{display:flex;align-items:center;gap:14px;padding:26px 22px;border-right:1px solid var(--line)}
.trust>div:last-child{border-right:0}
.trust b{display:block;font-weight:400;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.trust span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
@media(max-width:820px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}.trust>div{padding:18px 14px;border-bottom:1px solid var(--line);min-width:0;gap:10px}.trust>div:nth-child(2n){border-right:0}.trust>div:nth-last-child(-n+2):nth-child(odd),.trust>div:last-child{border-bottom:0}.trust>div>div{min-width:0;overflow-wrap:break-word;hyphens:auto}.trust b{letter-spacing:.06em}}
@media(max-width:480px){.trust>div{flex-direction:column;text-align:center;gap:8px;padding:18px 8px}.trust b{font-size:12px;letter-spacing:.05em}.trust span{font-size:12.5px}}
.cattiles{padding-top:56px}
.ctg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.ctile{position:relative;aspect-ratio:3/4;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;overflow:hidden;color:#efe6d2}
.ctile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ctile:hover img{transform:scale(1.04)}
.ctile span{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:var(--f-display);font-size:26px;text-align:left}
.story+.story{margin-top:-24px}.story.rev{flex-direction:row-reverse}
.story{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);margin:64px 0;background:var(--surface)}
.story>img{flex:1 1 360px;min-width:0;width:50%;max-height:520px;object-fit:cover}
.story>div:not(.storyside){flex:1 1 360px;padding:56px 48px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.storyside{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.storyside>img{width:100%;max-height:520px;object-fit:cover;display:block}
.storylogo{flex:1;min-height:300px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,var(--surface3) 0%,var(--surface) 70%)}
.storylogo img{width:min(60%,240px);height:auto;filter:drop-shadow(0 0 30px rgba(201,164,92,.3))}
.storyx{padding:28px 32px 32px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.storyx img{width:100%;height:200px;object-fit:cover;display:block}
.storyx h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2;margin:0}
.storyx p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
@media(max-width:700px){.storyside{border-right:0}}
.story h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,46px);line-height:1.1;margin:0}
.story p{margin:0;color:var(--muted);font-size:17px;line-height:1.8}
.eyebrow2{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.reviews{padding:24px 0 72px}
.rvcar{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.rvtrack{display:flex;gap:20px;width:max-content;animation:rvmove var(--dur,40s) linear infinite}
.rvtrack.static{width:auto;justify-content:center;flex-wrap:wrap;animation:none}
.rvcar:hover .rvtrack,.rvcar:focus-within .rvtrack,.rvcar.paused .rvtrack{animation-play-state:paused}
@keyframes rvmove{to{transform:translateX(calc(-50% - 10px))}}
.rvc{flex:0 0 300px;width:300px;margin:0;padding:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.rvc .stars{color:var(--gold);letter-spacing:.25em;font-size:15px}
.rvc blockquote{margin:0;font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.rvc figcaption{margin-top:auto;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rvimg{width:100%;height:170px;object-fit:cover;display:block;border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.rvtrack{animation:none;width:auto}.rvcar{overflow-x:auto}.rvc[aria-hidden=true]{display:none}}
.starpick{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;position:relative;margin-bottom:8px}
.starpick input{position:absolute;opacity:0;pointer-events:none}
.starpick label{font-size:38px;line-height:1;color:color-mix(in srgb,var(--muted) 45%,transparent);cursor:pointer;padding:4px 3px}
.starpick input:checked~label,.starpick label:hover,.starpick label:hover~label{color:var(--gold)}
.starpick input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.sizeg{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.sizeg summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sizeg div{padding:0 0 16px;color:var(--muted);font-size:15px;line-height:1.7}
.sizeg img{max-width:100%;margin-top:10px}
.banks{display:grid;gap:8px;margin-top:10px}.bank{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border:1px solid var(--line2);padding:10px 14px;background:var(--bg)}.bank.sel{margin-top:10px;border-color:var(--gold);display:grid;grid-template-columns:1fr auto;gap:10px 16px}.bank span{color:var(--gold-hi);letter-spacing:.04em;user-select:all}
.wafab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.wafab:hover{filter:brightness(1.1)}
.herologo{width:clamp(200px,28vw,300px);height:auto;display:block;margin:0 auto 22px;filter:drop-shadow(0 0 40px rgba(201,164,92,.3))}
.invlogo{display:block;width:120px;height:auto;margin:0 auto 8px}
.nav{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav a,.nav button.lk{color:var(--ink);text-decoration:none;font-size:11.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;padding:8px 0;background:none;border:0;cursor:pointer}
.nav a:hover,.nav button.lk:hover,.nl a:hover,.nr .lk:hover{color:var(--gold-hi)}
.nl a,.nr .lk{color:var(--ink);text-decoration:none;font-size:11.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;background:none;border:0;cursor:pointer;padding:8px 0}
.cartb{position:relative}
.badge{position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:600;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:2px;padding:14px 30px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:11.5px;color:var(--on-gold);background:var(--gold-grad);background-size:220% 100%;transition:background-position .6s,transform .15s,box-shadow .3s;text-decoration:none}
.btn:hover{background-position:100% 0;box-shadow:0 0 26px rgba(236,217,160,.32)}
.btn:active{transform:translateY(1px)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-130%);transition:transform .7s;pointer-events:none}
.btn:hover::after{transform:translateX(130%)}
.btn.sm{padding:10px 18px;font-size:11px}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--line2)}
.btn.ghost:hover{background:rgba(201,164,92,.1);box-shadow:none}
.btn.ghost::after{display:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(240,122,108,.5)}
.btn.danger::after{display:none}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.ib{background:none;border:1px solid var(--line);color:var(--ink);width:34px;height:34px;cursor:pointer;border-radius:2px}
.ib:hover{border-color:var(--gold)}

/* hero */
.hero{padding:48px 0 56px;text-align:center;position:relative}
.hero .eyebrow{letter-spacing:.55em;margin-right:-.55em;text-transform:uppercase;font-size:11px;font-weight:400;color:var(--gold)}
.hero h1{font-size:clamp(40px,8vw,104px);letter-spacing:.2em;margin-right:-.2em;font-weight:400;line-height:1.02;margin-top:22px;margin-bottom:6px}
.hero p{max-width:520px;margin:0 auto 34px;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:23px;font-weight:400;line-height:1.35}
.hero .rule{width:56px;height:1px;margin:26px auto 24px;background:var(--gold)}
.refbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;text-align:center;font-size:14px;color:var(--muted);margin:34px auto 0;max-width:560px}
.refbar b{color:var(--gold-hi);font-weight:500}

/* toolbar */
.sechead{text-align:center;margin:10px 0 30px}.sechead h2{font-size:clamp(30px,4vw,44px);font-weight:400;letter-spacing:.06em}.sechead .rule{width:56px;height:1px;background:var(--gold);margin:16px auto 0}
.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:0 0 34px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:22px;flex-wrap:wrap;flex:1 1 320px}
.chip{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);padding:6px 0;cursor:pointer;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.in{background:transparent;border:1px solid var(--line2);color:var(--ink);padding:11px 12px;width:100%;border-radius:0;font-weight:var(--fw,300)}
.in:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(201,164,92,.14)}
.in option{background:var(--surface2);color:var(--ink)}
select.in{appearance:auto}
textarea.in{min-height:84px;resize:vertical}
.tools .in{width:auto;flex:0 1 220px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:44px 28px;padding-bottom:80px}
.card{background:transparent;border:0;cursor:pointer;transition:transform .5s;display:flex;flex-direction:column;min-width:0;text-align:center}
.pimg{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;transition:outline-color .4s,box-shadow .5s}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,243,184,.34) 50%,transparent 65%);transform:translateX(-130%);transition:transform 1s;pointer-events:none}
.soldout{position:absolute;left:0;right:0;bottom:0;background:var(--veil);padding:8px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;z-index:2;color:var(--muted)}
.cbody{padding:18px 6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.ccat{font-size:10.5px;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--gold)}
.cbody h3{font-size:25px;line-height:1.15;font-weight:500}
.crow{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px;padding-top:0}
.price{font-family:var(--f-body);font-size:15px;font-weight:var(--fw,300);letter-spacing:.14em;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.empty{padding:50px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);grid-column:1/-1}

footer.ft{border-top:1px solid var(--line);padding:46px 0 56px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:14px}
footer.ft .lk{background:none;border:0;padding:8px 0;min-height:44px;color:var(--gold);font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:left}footer.ft .lk:hover{color:var(--gold-hi)}
footer.ft .credit{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:12px;letter-spacing:.12em}
footer.ft .credit a,footer.ft .credit .cred-in{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;min-height:32px}
footer.ft .credit a:hover{color:var(--gold-hi)}footer.ft .credit b{font-weight:500;letter-spacing:.16em;color:var(--ink)}
footer.ft .cred-lg{height:22px;width:auto;max-width:90px;object-fit:contain;border-radius:4px}
footer.ft .mx{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:var(--ovl);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 30px}
.ov.right{justify-content:flex-end;padding:0}
.modal{background:var(--surface);border:1px solid var(--line2);box-shadow:0 30px 90px rgba(0,0,0,.65);width:100%;max-width:980px;position:relative;margin:auto 0}
.modal.sm{max-width:520px}.modal.md{max-width:720px}
.drawer{max-width:430px;height:100%;margin:0;display:flex;flex-direction:column;overflow:auto;min-height:100vh}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.mh h2{font-size:28px;font-weight:400}
.mb{padding:22px}
.x{background:none;border:0;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;width:36px;height:36px}
.x:hover{color:var(--gold-hi)}

/* product detail */
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.gal{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.zoom{position:relative;overflow:hidden;aspect-ratio:1/1;background:var(--bg2);border:1px solid var(--line);cursor:zoom-in}
.zoom img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease-out;transform-origin:50% 50%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border:1px solid var(--line);padding:0;background:var(--bg2);cursor:pointer;aspect-ratio:1/1;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.th:hover img{transform:scale(1.2)}
.th.on{border-color:var(--gold-hi);box-shadow:0 0 14px rgba(236,217,160,.35)}
.pinfo{padding:28px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pinfo h2{font-size:clamp(32px,4vw,48px);line-height:1.05;font-weight:400}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:400}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line)}
.qty button{background:none;border:0;width:34px;height:36px;cursor:pointer;font-size:18px}
.qty button:hover{color:var(--gold-hi)}
.qty span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}

/* cart */
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;object-fit:cover;border:1px solid var(--line)}
.line h4{font-size:17px}
.tot{display:grid;gap:6px;margin:14px 0;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .big{font-family:var(--f-display);font-size:26px;font-weight:500;color:var(--gold-hi);border-top:1px solid var(--line2);padding-top:10px;margin-top:4px}

.pbic{color:var(--gold-hi);flex:none;margin-top:2px}.pbtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pbtx b{font-family:var(--f-display);font-weight:500;font-size:20px;color:var(--gold-hi)}.pbtx span{font-size:13.5px;color:var(--ink)}
.dot{display:inline-block;min-width:19px;height:19px;border-radius:10px;background:var(--gold-grad);color:var(--on-gold);font-size:11px;line-height:19px;text-align:center;font-weight:600;margin-left:6px;padding:0 5px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .sp{display:none}
}
</style>

/* ============ utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const costOf=pid=>{const c=(S.costs||[]).find(x=>x.id===pid);return c?c.cost:null};
function setCost(pid,v){S.costs=S.costs||[];if(v===''||v==null){S.costs=S.costs.filter(x=>x.id!==pid);return}const n=Math.max(0,Math.round(+v||0)),c=S.costs.find(x=>x.id===pid);if(c)c.cost=n;else S.costs.push({id:pid,cost:n})}
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
let S=null; // estado persistente
var API=false; // true cuando la tienda corre con el servidor y su base de datos
const UI={lang:(()=>{try{return localStorage.getItem('gt_lang')||''}catch(e){return ''}})(),cur:(()=>{try{return localStorage.getItem('gt_cur')||''}catch(e){return ''}})(),view:'store',cat:'all',q:'',sort:'nuevo',modal:null,img:0,qty:1,tab:null,co:{pay:'efectivo'},confirm:null,pf:'todos',cq:'',draft:null,persist:true};
const CURS=[['USD','Dólar estadounidense (Ecuador, El Salvador, Panamá)'],['EUR','Euro (España)'],['MXN','Peso mexicano'],['ARS','Peso argentino'],['BOB','Boliviano'],['BRL','Real brasileño'],['CLP','Peso chileno'],['CRC','Colón costarricense'],['CUP','Peso cubano'],['DOP','Peso dominicano'],['GTQ','Quetzal guatemalteco'],['HNL','Lempira hondureño'],['HTG','Gourde haitiano'],['NIO','Córdoba nicaragüense'],['PEN','Sol peruano'],['PYG','Guaraní paraguayo'],['UYU','Peso uruguayo'],['VES','Bolívar venezolano']];
const baseCur=()=>(S&&S.settings.currency)||'COP';
const curList=()=>((S&&S.settings.curs)||[]).filter(c=>c&&c.code&&+c.rate>0);
let CUR_O;const inOrder=(o,fn)=>{const p=CUR_O;CUR_O=o&&o.cur?o.cur:null;try{return fn()}finally{CUR_O=p}};
const curCode=()=>{if(CUR_O!==undefined)return CUR_O?CUR_O.code:null;if(typeof UI==='undefined'||!UI||!UI.cur||UI.cur===baseCur()||UI.view!=='store')return null;return curList().some(k=>k.code===UI.cur)?UI.cur:null};
const curRate=()=>{if(CUR_O!==undefined)return CUR_O?+CUR_O.rate:null;const c=curCode();const x=c&&curList().find(k=>k.code===c);return x?+x.rate:null};
const fmtCur=(n,code,d)=>{try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:code,currencyDisplay:'code',maximumFractionDigits:d,minimumFractionDigits:d}).format(n||0)}catch(e){return code+' '+(n||0).toFixed(d)}};
const money=n=>{const r=curRate();if(r){const cc=curCode(),d=['CLP','PYG'].includes(cc)?0:2;return fmtCur((n||0)/r,cc,d)}try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:baseCur(),maximumFractionDigits:0}).format(n||0)}catch(e){return '$'+Math.round(n||0)}};
const moneyBase=n=>inOrder(null,()=>money(n));
const curNote=()=>{const r=curRate();return r?`<p class="muted sm-t" style="margin:6px 0 0">Pagarás en ${curCode()}. Tasa de la tienda: 1 ${curCode()} = ${new Intl.NumberFormat('es-CO').format(r)} ${baseCur()}.</p>`:''};
const curSel=()=>{const l=curList();if(!l.length)return '';return `<select class="cursel" data-c="cur" aria-label="Moneda">${[baseCur(),...l.map(c=>c.code)].map(c=>`<option ${UI.cur===c||(!UI.cur&&c===baseCur())?'selected':''}>${c}</option>`).join('')}</select>`};
const fdate=t=>{try{return new Date(t).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}catch(e){return String(t)}};
const phoneDigits=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10&&d[0]==='3')d='57'+d;return d};
const prod=id=>S.products.find(p=>p.id===id);
const cat=id=>S.categories.find(c=>c.id===id);
const userById=id=>S.users.find(u=>u.id===id);
const me=()=>S&&S.session?userById(S.session):null;
const isPaid=o=>o.status==='pagado'||o.status==='entregado';
const nm=()=>(S&&S.settings.storeName)||'GOLDEN TOUCH';

const plr=(n,o,m)=>n+' '+(n===1?o:m);
const fday=k=>{const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const fshort=ts=>new Date(ts).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'});

function creditState(o){
  if(o.status==='cancelado')return'cancelado';if(o.status==='pendiente')return'aprobar';
  if(o.status==='pagado'||o.status==='entregado'||!nextInst(o))return'pagado';
  return o.plan.some(i=>!i.paid&&i.due<startOfToday())?'mora':'aldia';
}
const nInst=o=>o.plan?o.plan.filter(i=>!i.initial).length:0;
const instLabel=(o,i)=>i.initial?'Inicial':i.n+'/'+nInst(o);
const downOf=(total,raw)=>S.settings.creditDownEnabled?Math.min(Math.max(0,Math.round(+raw||0)),Math.floor(total*.9)):0;
function buildCreditPlan(total,n,from,down){
  const plan=buildPlan(total-down,n,from);
  if(down>0)plan.unshift({n:0,initial:true,due:from+2*864e5,amount:down,paid:false,paidAt:null});
  return plan;
}
function buildPlan(total,n,from){
  const base=Math.floor(total/n),plan=[];
  for(let i=0;i<n;i++){const d=new Date(from);d.setMonth(d.getMonth()+i+1);plan.push({n:i+1,due:d.getTime(),amount:i===n-1?total-base*(n-1):base,paid:false,paidAt:null})}
  return plan;
}
function payInstallment(oid,idx){
  const o=S.orders.find(x=>x.id===oid);if(!o||!o.plan)throw new Error('Crédito no encontrado');
  if(o.status!=='credito')throw new Error('Aprueba el crédito antes de registrar pagos');
  const i=o.plan[idx];if(!i||i.paid)return;
  i.paid=true;i.paidAt=Date.now();i.by=me()?me().name:'';
  if(o.plan.every(x=>x.paid)){o.status='pagado';o.paidAt=Date.now();awardPoints(o)}
}

function resizeLogo(file,max=520){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Imagen no válida'));im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.92))};im.src=fr.result};fr.readAsDataURL(file)});
}

/* ============ persistencia (IndexedDB) ============ */
const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('goldentouch',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};

function save(){if(API){Net.touch();return}dirty=true;const my=++saveSeq;clearTimeout(saveT);saveT=setTimeout(async()=>{try{S.rev=uid()+uid();await IDB.set('state',JSON.parse(JSON.stringify(S)));UI.persist=true;try{BC&&BC.postMessage(1)}catch(e){}}catch(e){UI.persist=false}if(my===saveSeq)dirty=false},250)}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gt:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(unescape(encodeURIComponent(s)))}}

function calcTotals(lines,couponCode,method,zoneId,pt,n,x){

  return{subtotal,discount,loy,coupon:cp.coupon,couponErr:cp.err,shipping,free,total:subtotal-discount-loy+shipping,extra:subtotal-sum(lines,l=>l.price*l.qty)};

const localCity=()=>(S.settings.localCity||'Montería');
const isLocalZ=z=>!z.kind||z.kind==='local';
const localZones=()=>S.zones.filter(isLocalZ);
const regionZones=()=>S.zones.filter(z=>z.kind==='region'&&z.active);
const countriesAvail=()=>[...new Set(regionZones().map(z=>z.country||'Colombia'))].sort((a,b)=>a==='Colombia'?-1:b==='Colombia'?1:a.localeCompare(b,'es'));
const shipTypes=()=>{const t=[];if(localZones().length)t.push('local');if(S.settings.shipRegions){const c=countriesAvail();if(c.includes('Colombia'))t.push('depto');if(c.some(x=>x!=='Colombia'))t.push('pais')}if(pickupOn())t.push('tienda');return t.length?t:['local']};
function geoState(co){
  const types=shipTypes();if(!types.includes(co.dtype))co.dtype=types[0];
  if(co.dtype==='tienda'){co.zoneId='';return {types,countries:[],zs:[],z:null,munis:[],barrios:[]}}
  let zs=localZones(),countries=[];
  if(co.dtype!=='local'){
    countries=countriesAvail().filter(c=>co.dtype==='depto'?c==='Colombia':c!=='Colombia');
    if(co.dtype==='depto')co.country='Colombia';else if(!countries.includes(co.country))co.country=countries[0]||'';
    zs=regionZones().filter(z=>(z.country||'Colombia')===co.country).sort((a,b)=>String(a.region||a.name).localeCompare(String(b.region||b.name),'es'));
  }
  if(!zs.some(z=>z.id===co.zoneId))co.zoneId='';
  const z=zs.find(x=>x.id===co.zoneId)||null,munis=(z&&z.munis)||[];
  if(co.muni!=='__otro'&&!munis.some(m=>m.name===co.muni))co.muni='';
  const m=munis.find(x=>x.name===co.muni),barrios=(m&&m.barrios)||[];
  if(co.barrio!=='__otro'&&!barrios.includes(co.barrio))co.barrio='';
  return {types,countries,zs,z,munis,barrios};
}
const optsHtml=(arr,sel,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
function geoHtml(co,v){

  let h=g.types.length>1?`<div class="seg full" role="radiogroup" aria-label="Tipo de entrega">${g.types.map(t=>`<label><input type="radio" name="dtype" value="${t}" ${co.dtype===t?'checked':''}><span>${esc(T[t])}</span></label>`).join('')}</div>`:'';
  if(co.dtype==='tienda'){const st=S.settings;return h+`<div class="note full" style="grid-column:1/-1;margin:0"><b style="color:var(--gold-hi)">${esc(st.pickupName||'Recoge en nuestra tienda')}</b>${st.pickupAddr?`<br>${esc(st.pickupAddr)}`:''}${st.pickupHours?`<br>Horario: ${esc(st.pickupHours)}`:''}${st.pickupNote?`<br><span class="muted">${esc(st.pickupNote)}</span>`:''}${st.pickupMap&&/^https?:\/\//i.test(st.pickupMap)?`<br><a href="${esc(st.pickupMap)}" target="_blank" rel="noopener">Ver mapa</a>`:''}<br><span class="muted">Sin costo de envío. Te avisamos cuando esté listo.</span></div>`}
  if(co.dtype==='local'){
    h+=fld('Barrio · '+esc(localCity()),`<select class="in" name="zoneId" required><option value="">Elige tu barrio</option>${g.zs.map(z=>`<option value="${z.id}" ${co.zoneId===z.id?'selected':''}>${esc(z.name)} · ${money(z.cost)}</option>`).join('')}</select>`);
  }else{
    if(co.dtype==='pais')h+=fld('País',`<select class="in" name="country" required>${g.countries.map(c=>`<option ${c===co.country?'selected':''}>${esc(c)}</option>`).join('')}</select>`);
    h+=fld(co.dtype==='depto'?'Departamento':'Región o estado',`<select class="in" name="zoneId" required><option value="">Elige una opción</option>${g.zs.map(z=>`<option value="${z.id}" ${co.zoneId===z.id?'selected':''}>${esc(z.region||z.name)} · ${money(z.cost)}</option>`).join('')}</select>`);
    if(g.z){
      if(g.munis.length){
        h+=fld('Municipio',`<select class="in" name="muni" required><option value="">Elige tu municipio</option>${g.munis.map(m=>`<option value="${esc(m.name)}" ${co.muni===m.name?'selected':''}>${esc(m.name)}</option>`).join('')}<option value="__otro" ${co.muni==='__otro'?'selected':''}>Otro municipio…</option></select>`);
      }
      if(!g.munis.length||co.muni==='__otro')h+=fld('Municipio o ciudad',`<input class="in" name="muniO" required value="${esc(co.muniO||'')}">`);
      if(g.barrios.length){
        h+=fld('Barrio',`<select class="in" name="barrio" required><option value="">Elige tu barrio</option>${g.barrios.map(b=>`<option value="${esc(b)}" ${co.barrio===b?'selected':''}>${esc(b)}</option>`).join('')}<option value="__otro" ${co.barrio==='__otro'?'selected':''}>Otro barrio…</option></select>`);
        if(co.barrio==='__otro')h+=fld('Escribe tu barrio',`<input class="in" name="barrioO" required value="${esc(co.barrioO||'')}">`);
      }else if(co.muni||co.muniO!==undefined||!g.munis.length)h+=fld('Barrio o vereda',`<input class="in" name="barrioO" value="${esc(co.barrioO||'')}">`);
    }
  }
  return h+fld('Dirección completa',`<input class="in" name="address" required value="${esc(v('address'))}" autocomplete="street-address" placeholder="Calle, número, apartamento, referencias">`,'full');
}
function composeAddr(co,dir){
  const g=geoState(co),z=g.z;if(!z)return dir;
  if(co.dtype==='local')return [z.name,localCity(),dir].filter(Boolean).join(', ');
  const muni=(co.muni==='__otro'||!g.munis.length)?(co.muniO||''):co.muni;
  const bar=(g.barrios.length&&co.barrio!=='__otro')?co.barrio:(co.barrioO||'');
  return [bar,muni,z.region||z.name,(z.country&&z.country!=='Colombia')?z.country:'',dir].filter(Boolean).join(', ');
}
const coDerive=(co,credOn)=>{
  if(!['efectivo','credito','transferencia'].includes(co.pay))co.pay=co.payType==='credito'?'credito':'efectivo';
  if(co.pay==='credito'&&!credOn)co.pay='efectivo';
  if(!['online','transferir'].includes(co.tsub))co.tsub=S.settings.payLink?'online':'transferir';
  co.payType=co.pay==='credito'?'credito':'contado';
  co.method=co.pay==='efectivo'?'contraentrega':co.pay==='credito'?'domicilio':(co.tsub==='online'?'online':'transferencia');

const REP_RANGES=[['7','Últimos 7 días'],['30','Últimos 30 días'],['90','Últimos 90 días'],['mes','Este mes'],['anio','Este año'],['todo','Todo el historial']];
function repRange(k){const n=new Date(),b=Date.now()+864e5;if(k==='todo')return{a:0,b,label:'todo'};if(k==='mes')return{a:new Date(n.getFullYear(),n.getMonth(),1).getTime(),b,label:'mes'};if(k==='anio')return{a:new Date(n.getFullYear(),0,1).getTime(),b,label:'anio'};const d=+k||30;return{a:Date.now()-d*864e5,b,label:d+'dias'}}
function repData(k){
  const r=repRange(k),ok=S.orders.filter(o=>['pagado','entregado','credito'].includes(o.status)&&o.date>=r.a&&o.date<r.b),m=new Map();
  ok.forEach(o=>{const f=o.subtotal>0?Math.max(0,(o.subtotal-o.discount-(o.loyDisc||0))/o.subtotal):1;
    o.lines.forEach(l=>{let x=m.get(l.pid);if(!x){const pr=prod(l.pid),c=pr&&cat(pr.categoryId);x={pid:l.pid,name:l.name,cat:c?c.name:'—',units:0,rev:0,revC:0,cost:0,hasCost:costOf(l.pid)!==null};m.set(l.pid,x)}
      const rv=l.price*l.qty*f;x.units+=l.qty;x.rev+=rv;const c=costOf(l.pid);if(c!==null){x.cost+=c*l.qty;x.revC+=rv}})});
  const rows=[...m.values()].map(x=>({...x,rev:Math.round(x.rev),revC:Math.round(x.revC),profit:x.hasCost?Math.round(x.revC-x.cost):null,margin:x.hasCost&&x.revC>0?(x.revC-x.cost)/x.revC*100:null}));
  const sold=new Set(rows.map(x=>x.pid)),idle=S.products.filter(p=>p.active&&p.stock>0&&!sold.has(p.id));
  const T={rev:sum(rows,x=>x.rev),revC:sum(rows,x=>x.revC),cost:sum(rows,x=>x.cost),units:sum(rows,x=>x.units),orders:ok.length};T.profit=T.revC-T.cost;T.margin=T.revC>0?T.profit/T.revC*100:null;

  return{r,rows,idle,T,cats:[...cats.values()].sort((a,b)=>b.rev-a.rev),noCost:rows.filter(x=>!x.hasCost).length};
}

function tVentas(){
  const today=dayKey(Date.now()),day=UI.day||today;
  const os=S.orders.filter(o=>dayKey(o.date)===day&&o.status!=='cancelado');
  const cuotasDia=S.orders.flatMap(o=>(o.plan||[]).filter(i=>i.paid&&i.paidAt&&dayKey(i.paidAt)===day));
  const total=sum(os,o=>o.total),cobrado=sum(os.filter(o=>o.payType!=='credito'&&isPaid(o)),o=>o.total),pend=sum(os.filter(o=>o.payType!=='credito'&&o.status==='pendiente'),o=>o.total),cred=sum(os.filter(o=>o.payType==='credito'),o=>o.total);
  const days=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(dayKey(d.getTime()))}
  const rows=days.map(k=>{const l=S.orders.filter(o=>dayKey(o.date)===k&&o.status!=='cancelado');return{k,n:l.length,t:sum(l,o=>o.total)}}),mx=Math.max(1,...rows.map(r=>r.t));

function nextCode(){let m=10000000;S.products.forEach(p=>{const n=/^\d{8}$/.test(p.code||'')?+p.code:0;if(n>m)m=n});return String(m+1)}
const POS0=()=>({cart:{},q:'',pay:'efectivo',recv:'',name:'',phone:'',coupon:''});

function cajaTotals(c){

  L.forEach(o=>{by[o.payMethod]=(by[o.payMethod]||0)+o.total});

function posEnter(v){
  v=String(v||'').trim();if(!v)return;const lc=v.toLowerCase();
  let p=S.products.find(x=>(x.code&&x.code.toLowerCase()===lc)||(x.sku&&x.sku.toLowerCase()===lc));
  if(!p){const l=S.products.filter(x=>x.active&&x.stock>0&&(x.name+' '+(x.code||'')+' '+(x.sku||'')).toLowerCase().includes(lc));if(l.length===1)p=l[0]}
  if(!p){beep(false);toast('No encontré ningún producto con «'+v+'»');UI.pos.q='';renderPC();return}
  if(!p.active||p.stock<=0){beep(false);toast(p.name+' no está disponible');UI.pos.q='';renderPC();return}
  const cur=UI.pos.cart[p.id]||0;if(cur+1>p.stock){beep(false);toast('No hay más stock de '+p.name);UI.pos.q='';renderPC();return}
  UI.pos.q='';UI.pos.cart[p.id]=cur+1;beep(true);renderPC();toast('+1 '+p.name);

let scanBuf='',scanT=0,camS=null,camT=0;
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='posq'){e.preventDefault();posEnter(e.target.value);return}
  if(e.key==='Enter'&&e.target&&e.target.name==='code'&&e.target.closest('form[data-f=product]')){e.preventDefault();return}
  if(!(UI.view==='panel'&&UI.tab==='mostrador'&&myCaja()))return;
  const t=e.target;if((t&&(/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName)||t.isContentEditable))||UI.modal||UI.confirm)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const now=Date.now();if(now-scanT>120)scanBuf='';scanT=now;
  if(e.key==='Enter'){if(scanBuf.length>=3){e.preventDefault();const v=scanBuf;scanBuf='';posEnter(v)}return}
  if(e.key.length===1)scanBuf+=e.key;
});

function xPlan(sheets,createCats){
  const key=Object.keys(sheets).find(k=>normH(k)==='productos')||Object.keys(sheets)[0],rows=(sheets[key]||[]).filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(rows.length<2)throw new Error('El archivo no tiene filas de productos');
  const map={};rows[0].forEach((h,i)=>{const n=normH(h);if(!n)return;for(const [f,al] of XFIELDS){if(map[f]===undefined&&al.some(a=>n.startsWith(a))){map[f]=i;break}}});
  const miss=['name','category','price','stock'].filter(f=>map[f]===undefined);
  if(miss.length)throw new Error('Faltan columnas: '+miss.map(f=>({name:'Nombre',category:'Categoría',price:'Precio',stock:'Stock'}[f])).join(', ')+'. Descarga la plantilla para ver el formato');
  if(rows.length>2001)throw new Error('Máximo 2.000 productos por archivo');
  const g=(r,f)=>map[f]===undefined?'':r[map[f]]??'',T=v=>String(v??'').trim();
  const seen=new Set(),newCats=new Map(),plan=[],catByName=n=>S.categories.find(c=>normH(c.name)===normH(n));
  let seqCode=null;const nextSeq=()=>{if(seqCode===null){let m=10000000;S.products.forEach(p=>{const n=/^\d{8}$/.test(p.code||'')?+p.code:0;if(n>m)m=n});seqCode=m}return String(++seqCode)};
  const usedC=new Set();S.products.forEach(p=>{if(p.code)usedC.add(p.code.toLowerCase());if(p.sku)usedC.add(p.sku.toLowerCase())});
  rows.slice(1).forEach((r,i)=>{
    const line=i+2,sku=T(g(r,'sku')),code=T(g(r,'code')),name=T(g(r,'name')),errs=[];
    if(/^ejemplo-/i.test(sku))return;
    if(!sku&&!code&&T(g(r,'category'))===''&&/^total/i.test(name))return;
    const lcs=sku.toLowerCase(),lcc=code.toLowerCase();
    let ex=(sku||code)?S.products.find(p=>(sku&&((p.sku||'').toLowerCase()===lcs||(p.code||'').toLowerCase()===lcs))||(code&&((p.code||'').toLowerCase()===lcc||(p.sku||'').toLowerCase()===lcc))):null;
    if(!ex&&!sku&&!code&&name){const same=S.products.filter(p=>normH(p.name)===normH(name));if(same.length===1)ex=same[0]}
    for(const k of [lcs,lcc])if(k){if(seen.has(k))errs.push('SKU/código repetido en el archivo');}
    [lcs,lcc].filter(Boolean).forEach(k=>seen.add(k));
    if(ex&&sku&&code){const other=S.products.find(p=>p!==ex&&(((p.sku||'').toLowerCase()===lcs||(p.code||'').toLowerCase()===lcs)||((p.code||'').toLowerCase()===lcc||(p.sku||'').toLowerCase()===lcc)));if(other)errs.push('SKU y código pertenecen a productos distintos')}
    if(!ex&&!name)errs.push('Falta el nombre');
    if(!ex&&T(g(r,'category'))==='')errs.push('Falta la categoría');
    const d={};
    if(name)d.name=name.slice(0,120);
    const cn=T(g(r,'category'));if(cn){const c=catByName(cn);if(c)d.categoryId=c.id;else if(createCats){d.newCat=cn;newCats.set(normH(cn),cn)}else errs.push('Categoría «'+cn+'» no existe')}
    const pr=g(r,'price'),pv=T(pr)===''?null:numX(pr);
    if(pv===null){if(!ex)errs.push('Falta el precio')}else if(isNaN(pv)||pv<0)errs.push('Precio no válido');else d.price=Math.round(pv);
    const st=g(r,'stock'),sv=T(st)===''?null:numX(st);
    if(sv===null){if(!ex)errs.push('Falta el stock')}else if(isNaN(sv)||sv<0)errs.push('Stock no válido');else d.stock=Math.floor(sv);
    const dc=g(r,'discount');if(T(dc)!==''){const v=numX(dc);if(isNaN(v)||v<0||v>90)errs.push('Descuento debe estar entre 0 y 90');else d.discount=Math.round(v)}
    const mk=g(r,'markup');if(T(mk)!==''){const v=numX(mk);if(isNaN(v)||v<0)errs.push('Recargo no válido');else d.creditMarkup=v}
    if(T(g(r,'material'))!=='')d.material=T(g(r,'material')).slice(0,80);
    if(T(g(r,'desc'))!=='')d.desc=T(g(r,'desc')).slice(0,1200);
    const cr=boolX(g(r,'credit'),null);if(cr===null&&T(g(r,'credit'))!=='')errs.push('“Permite crédito” debe ser SI o NO');else if(cr!==null)d.creditOff=!cr;
    const ac=boolX(g(r,'active'),null);if(ac===null&&T(g(r,'active'))!=='')errs.push('“Visible” debe ser SI o NO');else if(ac!==null)d.active=ac;
    const imgs=['img1','img2','img3'].map(f=>T(g(r,f))).filter(Boolean);
    for(const u of imgs)if(!/^https?:\/\/\S+$/i.test(u)){errs.push('La imagen debe ser una URL que empiece por http:// o https://');break}
    if(imgs.length&&!errs.length)d.images=imgs.slice(0,3);
    if(sku)d.sku=sku.slice(0,40);if(code)d.code=code.slice(0,40);
    plan.push({line,ex,d,errs,name:name||(ex&&ex.name)||'(sin nombre)',action:ex?'actualizar':'crear',dupe:null});
  });

  plan.forEach(p=>{if(!p.errs.length&&!p.ex&&!p.d.sku&&!p.d.code){let c;do{c=nextSeq()}while(usedC.has(c));usedC.add(c);p.d.code=c}});
  return {plan,newCats:[...newCats.values()],sheet:key};
}

/* ============ configuración guardada en MySQL (POST /api/sync.php y POST /api/ops.php) ============ */
/* MySQL es la fuente principal. localStorage solo guarda una copia temporal cuando el servidor no responde
   y nunca se usa para sobrescribir MySQL al abrir la página. */
const CFG={on:true,ready:false,seen:false,last:null,flight:null,t:null,KEY:'gt-config-backup'};
const cfgJson=()=>JSON.stringify(S&&S.settings||{});
async function cfgCall(url,body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin',cache:'no-store',signal:c.signal});
    let j=null;try{j=await r.json()}catch(e){}
    return{status:r.status,j};
  }catch(e){return{status:0,j:null}}finally{clearTimeout(t)}
}
function cfgBackup(on){try{if(on)localStorage.setItem(CFG.KEY,JSON.stringify({ts:Date.now(),data:S.settings}));else localStorage.removeItem(CFG.KEY)}catch(e){}}
function cfgPending(){try{const v=JSON.parse(localStorage.getItem(CFG.KEY)||'null');return v&&v.data&&typeof v.data==='object'?v:null}catch(e){return null}}
/* carga: pide { collection:'config', since:0 } y busca el registro { id:'settings' } */
async function cfgLoad(){
  const r=await cfgCall('/api/sync.php',{collection:'config',since:0});
  if(r.status===404||r.status===405){CFG.on=false;CFG.ready=true;return}   // este servidor no usa estos endpoints
  if(r.status===200&&r.j&&r.j.ok!==false){
    const list=Array.isArray(r.j)?r.j:(r.j.records||r.j.items||r.j.changes||(Array.isArray(r.j.data)?r.j.data:[]));
    const rec=list.find(x=>x&&x.id==='settings');
    let data=rec&&(rec.data!==undefined?rec.data:(rec.doc!==undefined?rec.doc:rec.value));
    if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){data=null}}
    CFG.seen=true;
    if(data&&typeof data==='object'&&!Array.isArray(data)){
      S.settings=data;migrate();
      if(API&&typeof Net!=='undefined'&&Net.base)Net.base.settings=FH(JSON.stringify(S.settings));
    }
    CFG.last=cfgJson();CFG.ready=true;
    if(cfgPending()&&isStaff(me()))toast('Hay cambios de una sesión anterior sin enviar al servidor. Se conservó una copia en este navegador; revisa la configuración y pulsa Guardar.');
    return;
  }
  CFG.ready=true;
  if(r.status===0||r.status>=500){                       // el servidor no responde: se usa la copia temporal si existe
    const p=cfgPending();
    if(p){S.settings=p.data;migrate();toast('No se pudo conectar con el servidor. Se muestra la última configuración guardada en este navegador.')}
  }
}
/* guarda: envía la configuración COMPLETA actual a /api/ops.php */
async function cfgSave(explicit){
  if(!CFG.on){if(explicit)toast('Ajustes guardados');return false}
  if(!isStaff(me())){if(explicit)toast('Ajustes guardados');return false}
  const snap=cfgJson();CFG.flight=snap;
  const r=await cfgCall('/api/ops.php',{ops:[{collection:'config',id:'settings',op:'set',data:S.settings}]});
  CFG.flight=null;
  if(r.status===200&&r.j&&r.j.ok===true){CFG.last=snap;CFG.seen=true;cfgBackup(false);if(explicit)toast('Configuración guardada correctamente en la base de datos');return true}
  if(r.status===404||r.status===405){CFG.on=false;if(explicit)toast('Ajustes guardados');return false}
  const why=r.j&&r.j.error?' ('+String(r.j.error).slice(0,120)+')':'';
  if(r.status===400)toast('No se pudo guardar: la configuración enviada no es válida'+why);
  else if(r.status===401||r.status===403)toast('No tienes permiso para guardar la configuración. Inicia sesión como administrador'+why);
  else if(r.status===200)toast('El servidor respondió, pero no confirmó el guardado'+why);
  else if(r.status===0||r.status>=500){
    cfgBackup(true);
    if(r.status===0){if(explicit||CFG.seen)toast('Sin conexión con el servidor. La configuración quedó guardada solo de forma temporal en este navegador')}
    else toast('Error del servidor al guardar la configuración (código '+r.status+'). Quedó una copia temporal en este navegador'+why);
  }else toast('No se pudo guardar la configuración (código '+r.status+')'+why);
  return false;
}
function cfgTouch(){
  if(!CFG.on||!CFG.ready||typeof me!=='function'||!S||!isStaff(me()))return;
  clearTimeout(CFG.t);CFG.t=setTimeout(()=>{const j=cfgJson();if(j!==CFG.last&&j!==CFG.flight)cfgSave(false)},700);
}

function resizeImage(file,max=1000){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Imagen no válida'));im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#0b0905';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.84))};im.src=fr.result};fr.readAsDataURL(file)});
}

}

// coloca el sprite: la mariposa gira hacia donde va; el colibrí se voltea de lado y se inclina (vuela de perfil)
function placeFx(el,x,y,ang){
  if(!el.classList.contains('hb')){el.style.transform=`translate(${x}px,${y}px) rotate(${ang}deg)`;return}
  const dx=x-(el._x===undefined?x:el._x),dy=y-(el._y===undefined?y:el._y);el._x=x;el._y=y;
  if(Math.abs(dx)>.35)el._d=dx>0?1:-1;
  const t=Math.max(-38,Math.min(38,Math.atan2(dy,Math.max(Math.abs(dx),1.5))*180/Math.PI));
  el._t=el._t===undefined?t:el._t*.85+t*.15;
  el.style.transform=`translate(${x}px,${y}px) scale(${(el._d||1)*(S.settings.fxImg&&S.settings.fxFace==='left'?-1:1)},1) rotate(${el._t}deg)`;
}

/* ============ mariposa dorada: vuela alrededor de la página y se posa en la joya preferida, cada 3 minutos ============ */
(function(){
  if(reduced)return;
  const EVERY=180000;
  let el=null,busy=false;
  function build(mode){
    el=document.createElement('div');el.className='bfly';el.setAttribute('aria-hidden','true');
    el.innerHTML=`<svg viewBox="-30 -30 60 60"><defs><linearGradient id="bw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#8a6a2b"/></linearGradient></defs>
    <g class="wl"><path d="M0 -2 C-8 -22 -26 -26 -27 -14 C-28 -4 -14 0 0 2Z" fill="url(#bw)" stroke="#fff3b8" stroke-width=".6"/><path d="M0 2 C-12 4 -22 12 -17 20 C-12 26 -3 16 0 4Z" fill="url(#bw)" stroke="#fff3b8" stroke-width=".6"/></g>
    <g class="wr"><path d="M0 -2 C8 -22 26 -26 27 -14 C28 -4 14 0 0 2Z" fill="url(#bw)" stroke="#fff3b8" stroke-width=".6"/><path d="M0 2 C12 4 22 12 17 20 C12 26 3 16 0 4Z" fill="url(#bw)" stroke="#fff3b8" stroke-width=".6"/></g>
    <ellipse cx="0" cy="0" rx="2" ry="11" fill="#2a1f0a"/><path d="M-1 -10 Q-6 -20 -10 -22 M1 -10 Q6 -20 10 -22" stroke="#d4af37" stroke-width="1" fill="none"/></svg>`;
    if(mode==='colibries'){el.className='bfly hb pk';el.innerHTML=hbSvg(HBP[0])}
    el.dataset.mode=mode;document.body.appendChild(el);
  }
  // recorrido: lazo cuadrado redondeado pegado a los bordes, con vaivén
  function pos(t){
    const w=innerWidth,h=innerHeight,th=-Math.PI/2+t*2*Math.PI,c=Math.cos(th),sn=Math.sin(th);
    const k=.5,sx=Math.sign(c)*Math.pow(Math.abs(c),k),sy=Math.sign(sn)*Math.pow(Math.abs(sn),k);
    const mx=Math.min(70,w*.08),my=Math.min(70,h*.1);
    return [w/2+sx*(w/2-mx)+Math.sin(t*38)*22,h/2+sy*(h/2-my)+Math.cos(t*29)*18];
  }
  // joya preferida: la más puntuada (favoritos, visitas, carrito, tiempo mirándola) que esté a la vista
  function pickTarget(){
    if(UI.view!=='store'||UI.modal)return null;
    const sc=id=>((S.prefs&&S.prefs[id])||0)+(S.favs&&S.favs[id]?20:0);
    const cards=[...document.querySelectorAll('.card[data-id]')].map(c=>({c,s:sc(c.dataset.id)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    for(const x of cards){const r=x.c.querySelector('.pimg').getBoundingClientRect();if(r.width>0&&r.top>70&&r.bottom<innerHeight-10)return x.c}
    return null;
  }
  const spot=c=>{const r=c.querySelector('.pimg').getBoundingClientRect();return[r.left+r.width*.5+r.width*.22,r.top+r.height*.14]};
  function fly(k){
    k=typeof k==='number'?k:1;
    if(busy||document.hidden||UI.view==='panel')return;
    const mode=FX();if(mode==='off')return;
    if(el&&el.dataset.mode!==mode){el.remove();el=null}
    if(!el)build(mode);
    busy=true;el.classList.remove('rest');
    const LOOP=16000*k,GLIDE=2600*k,REST=7500*k,FADE=900*k;
    const t0=performance.now();let lastSp=0,card=null,decided=false,from=null,tEnd=0;
    const spark=(x,y,now,gap)=>{if(now-lastSp>gap){lastSp=now;const sp=document.createElement('i');sp.className=el.classList.contains('hb')?'sp pk':'sp';sp.style.cssText=`left:${x}px;top:${y}px;--s:${5+Math.random()*7}px;--dx:${Math.random()*20-10}px;--dy:${8+Math.random()*12}px`;document.body.appendChild(sp);setTimeout(()=>sp.remove(),900)}};
    (function step(now){
      const e=now-t0;let x,y,ang,op=1;
      if(e<LOOP){
        const t=e/LOOP;[x,y]=pos(t);const [x2,y2]=pos(Math.min(1,t+.004));
        ang=Math.atan2(y2-y,x2-x)*180/Math.PI+90;op=Math.min(1,t/.06);spark(x,y,now,140);
      }else{
        if(!decided){decided=true;card=pickTarget();from=pos(1);tEnd=LOOP+GLIDE+REST}
        if(!card){ // sin joya favorita a la vista: se desvanece como antes
          const f=(e-LOOP)/FADE;[x,y]=pos(1);ang=0;op=Math.max(0,1-f);
          if(f>=1){end();return}
        }else if(e<LOOP+GLIDE){ // planea hacia la joya
          const u=(e-LOOP)/GLIDE,ease=u*u*(3-2*u),[tx,ty]=spot(card),mx=(from[0]+tx)/2,my=(from[1]+ty)/2-120;
          const bx=(1-ease)*(1-ease)*from[0]+2*(1-ease)*ease*mx+ease*ease*tx,by=(1-ease)*(1-ease)*from[1]+2*(1-ease)*ease*my+ease*ease*ty;
          const e2=Math.min(1,ease+.02),bx2=(1-e2)*(1-e2)*from[0]+2*(1-e2)*e2*mx+e2*e2*tx,by2=(1-e2)*(1-e2)*from[1]+2*(1-e2)*e2*my+e2*e2*ty;
          x=bx;y=by;ang=Math.atan2(by2-by,bx2-bx)*180/Math.PI+90;spark(x,y,now,160);
        }else if(e<tEnd){ // posada, aleteo lento
          [x,y]=spot(card);ang=18+Math.sin(e/700)*6;
          if(!el.classList.contains('rest')){el.classList.add('rest');card.classList.add('bf-on')}
        }else{
          const f=(e-tEnd)/FADE;[x,y]=spot(card);ang=18;op=Math.max(0,1-f);
          if(f>=1){end();return}
        }
      }
      el.style.opacity=op;
      placeFx(el,x,y,ang);
      requestAnimationFrame(step);
    })(t0);
    function end(){el.style.opacity=0;el.classList.remove('rest');document.querySelectorAll('.card.bf-on').forEach(c=>c.classList.remove('bf-on'));busy=false}
  }
  window.__butterfly=fly;
  setTimeout(()=>{fly();setInterval(fly,EVERY)},4000);
})();

/* ============ mariposa azul del mostrador: baja por el espacio libre del menú, llega a la esquina y cruza hasta la esquina inferior derecha; cada 3 minutos ============ */
(function(){
  if(reduced)return;
  const EVERY=180000;let el=null,busy=false,last=0,since=0,cancel=false;
  function build(mode){
    el=document.createElement('div');el.className='bfly blue';el.setAttribute('aria-hidden','true');
    el.innerHTML=`<svg viewBox="-30 -30 60 60"><defs><linearGradient id="bwb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f7ff"/><stop offset=".45" stop-color="#37a6ff"/><stop offset="1" stop-color="#0a4cb3"/></linearGradient></defs>
    <g class="wl"><path d="M0 -2 C-8 -22 -26 -26 -27 -14 C-28 -4 -14 0 0 2Z" fill="url(#bwb)" stroke="#d8f1ff" stroke-width=".6"/><path d="M0 2 C-12 4 -22 12 -17 20 C-12 26 -3 16 0 4Z" fill="url(#bwb)" stroke="#d8f1ff" stroke-width=".6"/></g>
    <g class="wr"><path d="M0 -2 C8 -22 26 -26 27 -14 C28 -4 14 0 0 2Z" fill="url(#bwb)" stroke="#d8f1ff" stroke-width=".6"/><path d="M0 2 C12 4 22 12 17 20 C12 26 3 16 0 4Z" fill="url(#bwb)" stroke="#d8f1ff" stroke-width=".6"/></g>
    <ellipse cx="0" cy="0" rx="2" ry="11" fill="#06224d"/><path d="M-1 -10 Q-6 -20 -10 -22 M1 -10 Q6 -20 10 -22" stroke="#37a6ff" stroke-width="1" fill="none"/></svg>`;
    if(mode==='colibries'){el.className='bfly hb pk';el.innerHTML=hbSvg(HBP[1])}

  }
  const inMostrador=()=>UI.view==='panel'&&UI.tab==='mostrador'&&!UI.modal;
  function fly(k){
    k=typeof k==='number'?k:1;
    if(busy||document.hidden||!inMostrador())return;
    const mode=FX();if(mode==='off')return;
    if(el&&el.dataset.mode!==mode){el.remove();el=null}
    if(!el)build(mode);
    const side=document.querySelector('.side');if(!side)return;
    const sr=side.getBoundingClientRect(),lastBtn=side.lastElementChild?side.lastElementChild.getBoundingClientRect():sr,W=innerWidth,H=innerHeight;
    const wide=sr.height>sr.width; // menú vertical (escritorio) o en fila (móvil)
    const x0=wide?sr.left+sr.width/2:28,y0=Math.min(H*.55,(wide?lastBtn.bottom:sr.bottom)+24);
    const cx=wide?Math.max(26,sr.left+22):26,cy=H-34,ex=W-34,ey=H-34;
    const D1=5200*k,D2=5200*k,FADE=900*k,t0=performance.now();let lastSp=0;busy=true;cancel=false;last=Date.now();
    const spark=(x,y,now,gap)=>{if(now-lastSp>gap){lastSp=now;for(let n=0;n<2;n++){const sp=document.createElement('i');sp.className=el.classList.contains('hb')?'sp pk':'sp blue';sp.style.cssText=`left:${x+Math.random()*10-5}px;top:${y+Math.random()*10-5}px;--s:${6+Math.random()*9}px;--dx:${Math.random()*34-17}px;--dy:${10+Math.random()*18}px`;document.body.appendChild(sp);setTimeout(()=>sp.remove(),900)}}};
    const P1=u=>[x0+(cx-x0)*u+Math.sin(u*14)*Math.min(46,(sr.width||90)*.22)*(1-u*.4),y0+(cy-y0)*(u*u*(3-2*u))];
    const P2=u=>{const e=u*u*(0.4+0.6*u);return[cx+(ex-cx)*e,cy-Math.sin(Math.PI*e)*Math.min(110,H*.16)+Math.sin(u*40)*9]};

      if(e<D1){const u=e/D1;[x,y]=P1(u);const [x2,y2]=P1(Math.min(1,u+.01));ang=Math.atan2(y2-y,x2-x)*180/Math.PI+90;op=Math.min(1,u/.1);spark(x,y,now,90)}

  },1000);
})();

/* ============ 8 mariposas brillantes alrededor del recuadro de ingreso / registro (amarillas, azules y rosadas) ============ */
(function(){
  if(reduced)return;
  const COLS=[
    {k:'yl',a:'#fffbd0',b:'#ffd21f',c:'#c98a00',st:'#fff6b0',body:'#3a2a00',sp:'yl'},
    {k:'blue',a:'#e6f7ff',b:'#37a6ff',c:'#0a4cb3',st:'#d8f1ff',body:'#06224d',sp:'blue'},
    {k:'pk',a:'#ffe6f3',b:'#ff5fb0',c:'#b3135f',st:'#ffd3ea',body:'#4a0a2c',sp:'pk'}];
  const N=8;let sw=null,last=null,t0=0,fade=0;
  function mk(i){
    const C=COLS[i%3],id='sw'+i,el=document.createElement('div');el.className='bfly sw '+C.k;el.setAttribute('aria-hidden','true');

    <g class="wr"><path d="M0 -2 C8 -22 26 -26 27 -14 C28 -4 14 0 0 2Z" fill="url(#${id})" stroke="${C.st}" stroke-width=".6"/><path d="M0 2 C12 4 22 12 17 20 C12 26 3 16 0 4Z" fill="url(#${id})" stroke="${C.st}" stroke-width=".6"/></g>
    <ellipse cx="0" cy="0" rx="2" ry="11" fill="${C.body}"/><path d="M-1 -10 Q-6 -20 -10 -22 M1 -10 Q6 -20 10 -22" stroke="${C.b}" stroke-width="1" fill="none"/></svg>`;
    if(hb){el.className='bfly sw hb pk'}
    el.style.opacity=0;document.body.appendChild(el);
    return {el,C:hb?{sp:'pk'}:C,off:i/N,speed:1+((i*37)%5-2)*.05,wob:i*1.7,ls:0};
  }
  const rectNow=()=>{const m=document.querySelector('#ov .modal');if(m){const r=m.getBoundingClientRect();if(r.width>0)last=r}return last};
  function spot(b,u,r,now){
    const W=innerWidth,H=innerHeight,m=38,cx=r.left+r.width/2,cy=r.top+r.height/2,a=r.width/2+m,h=r.height/2+m,th=-Math.PI/2+u*2*Math.PI,c=Math.cos(th),sn=Math.sin(th),k=.42;
    const rad=Math.sin(now/900+b.wob)*10;
    let x=cx+Math.sign(c)*Math.pow(Math.abs(c),k)*(a+rad),y=cy+Math.sign(sn)*Math.pow(Math.abs(sn),k)*(h+rad);
    x=Math.max(16,Math.min(W-16,x));y=Math.max(16,Math.min(H-16,y));return [x,y];
  }
  function start(){
    if(sw)return;sw=[];for(let i=0;i<N;i++)sw.push(mk(i));t0=performance.now();fade=0;requestAnimationFrame(loop);
  }
  function loop(now){
    if(!sw)return;
    const want=UI.modal&&(UI.modal.t==='login'||UI.modal.t==='register')&&FX()!=='off',r=rectNow();
    if(want)fade=Math.min(1,fade+.025);else fade=Math.max(0,fade-.05);
    if(!want&&fade<=0){sw.forEach(b=>b.el.remove());sw=null;last=null;return}
    if(r){
      sw.forEach((b,i)=>{
        const T=16000,u=((now-t0)/T*b.speed+b.off)%1,[x,y]=spot(b,u,r,now),[x2,y2]=spot(b,(u+.006)%1,r,now),ang=Math.atan2(y2-y,x2-x)*180/Math.PI+90;
        b.el.style.opacity=Math.min(1,fade*(1.2+i*.02));placeFx(b.el,x,y,ang);
        if(want&&now-b.ls>210+(i%3)*40){b.ls=now;const sp=document.createElement('i');sp.className='sp '+b.C.sp;sp.style.cssText=`left:${x+Math.random()*8-4}px;top:${y+Math.random()*8-4}px;--s:${5+Math.random()*8}px;--dx:${Math.random()*30-15}px;--dy:${8+Math.random()*16}px`;document.body.appendChild(sp);setTimeout(()=>sp.remove(),900)}
      });

  }
  setInterval(()=>{if(!sw&&UI.modal&&(UI.modal.t==='login'||UI.modal.t==='register')&&FX()!=='off'&&!document.hidden)start()},250);

})();

  if(API&&S&&r&&!S.users.some(x=>x.active&&String(x.code).toUpperCase()===r[1].toUpperCase())){Net.api('api/ref?code='+encodeURIComponent(r[1])).then(j=>{if(j.user)S.users.push(j.user);readHash0()}).catch(readHash0);return}

function readHash0(){

  const r=h.match(/(?:^|_)r-([A-Za-z0-9]+)/),p=h.match(/(?:^|_)p-([a-z0-9]+)/);

/* ============ servidor: base de datos compartida ============ */
const NCOLS=['categories','products','coupons','zones','users','customers','orders','creditReqs','notifs','cashClosings','reviews','carts','costs'];
const NWRITE={anon:['orders'],customer:['orders','customers','creditReqs','notifs','reviews'],vendedor:['orders','customers','notifs'],cajero:['orders','cashClosings'],
  gerente:['settings','categories','products','coupons','zones','customers','orders','creditReqs','notifs','cashClosings','costs'],
  admin:['settings','categories','products','coupons','zones','users','customers','orders','creditReqs','notifs','cashClosings','reviews','carts','costs']};
const FH=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return str.length+'.'+(h>>>0).toString(36)};
const Net={
  keep:new Set(),
  base:{},rev:0,off:false,pend:0,snapT:0,loop:0,timer:0,busy:false,pulling:false,es:null,
  async api(path,body){
    let r;
    try{r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'})}
    catch(x){Net.setOff(true);const er=new Error('Sin conexión a internet. Inténtalo cuando vuelva');er.status=0;throw er}
    Net.setOff(false);
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error)||'Error de conexión');e.status=r.status;throw e}
    return j;
  },
  role(){const u=S&&S.session?userById(S.session):null;return u?u.role:(S&&S.custSession?'customer':'anon')},
  setMe(me){S.session=me&&me.kind==='user'?me.id:null;S.custSession=me&&me.kind==='customer'?me.id:null},
  rebase(){
    Net.base={settings:FH(JSON.stringify(S.settings))};
    for(const c of NCOLS){const m=new Map();(S[c]||[]).forEach(d=>m.set(d.id,FH(JSON.stringify(d))));Net.base[c]=m}
  },
  ops(){
    const ops=[];
    for(const col of NWRITE[Net.role()]||[]){
      if(col==='settings'){if(Net.base.settings!==FH(JSON.stringify(S.settings)))ops.push({col,id:'main',doc:S.settings});continue}
      const b=Net.base[col]||new Map(),cur=new Set();
      for(const d of S[col]){cur.add(d.id);if(b.get(d.id)!==FH(JSON.stringify(d)))ops.push({col,id:d.id,doc:d})}
      for(const id of b.keys())if(!cur.has(id))ops.push({col,id,doc:null});
    }
    // abrir caja primero, cerrar caja al final (para que las ventas pendientes queden dentro del cierre)
    const pr=o=>o.col==='cashClosings'?(o.doc&&o.doc.status==='cerrada'?2:(Net.base.cashClosings&&Net.base.cashClosings.has(o.id)?1:0)):1;
    return ops.map((o,i)=>[o,i]).sort((a,b)=>pr(a[0])-pr(b[0])||a[1]-b[1]).map(x=>x[0]);
  },
  apply(changes){
    let n=0;
    for(const c of changes){
      if(c.col==='settings'){if(c.doc){S.settings=c.doc;Net.base.settings=FH(JSON.stringify(c.doc));n++}continue}
      const arr=S[c.col];if(!arr)continue;
      if(c.col==='orders'&&Net.keep.has(c.id)&&(c.doc===null||c.doc===undefined))continue;
      const i=arr.findIndex(x=>x.id===c.id),b=Net.base[c.col]||(Net.base[c.col]=new Map());
      if(c.doc===null||c.doc===undefined){if(i>=0){arr.splice(i,1);n++}b.delete(c.id)}
      else{const js=FH(JSON.stringify(c.doc));if(i>=0&&b.get(c.id)===js)continue;if(i>=0)arr[i]=c.doc;else arr.push(c.doc);b.set(c.id,js);n++}
    }
    S.orders.sort((a,b)=>b.date-a.date);S.notifs.sort((a,b)=>b.ts-a.ts);S.creditReqs.sort((a,b)=>b.date-a.date);
    return n;
  },
  localGet(){try{return JSON.parse(localStorage.getItem('gt-local')||'{}')}catch(e){return {}}},
  saveLocal(){try{localStorage.setItem('gt-local',JSON.stringify({cart:S.cart,ref:S.ref,favs:S.favs,prefs:S.prefs}))}catch(e){}},
  touch(){Net.saveLocal();Net.pend=Math.max(1,Net.pend);Net.chip();Net.snap();clearTimeout(Net.timer);Net.timer=setTimeout(Net.flush,220)},
  snap(){
    clearTimeout(Net.snapT);
    Net.snapT=setTimeout(async()=>{try{
      const cols={},base={settings:Net.base.settings};
      for(const c of NCOLS){cols[c]=S[c];base[c]=[...(Net.base[c]||new Map())]}
      await IDB.set('snap',{v:1,ts:Date.now(),rev:Net.rev,counter:S.counter,session:S.session,custSession:S.custSession,settings:S.settings,cols,base});
    }catch(e){}},1200);
  },
  restore(sn){
    for(const c of NCOLS)S[c]=sn.cols[c]||[];
    S.settings=sn.settings||{};S.session=sn.session||null;S.custSession=sn.custSession||null;S.counter=sn.counter||100;Net.rev=sn.rev||0;
    Net.base={settings:sn.base.settings};for(const c of NCOLS)Net.base[c]=new Map(sn.base[c]||[]);
    migrate();S.notifs.forEach(n=>shown.add(n.id));
  },
  setOff(v){
    if(Net.off===v)return;Net.off=v;
    if(v)toast('Sin internet: puedes seguir trabajando. Todo se enviará al volver la conexión');
    else{toast('Conexión restablecida');clearTimeout(Net.timer);Net.timer=setTimeout(Net.flush,50)}
    Net.chip();
  },
  chip(){
    let el=document.getElementById('netchip');
    if(!el){el=document.createElement('div');el.id='netchip';el.setAttribute('role','status');el.style.cssText='position:fixed;left:12px;bottom:12px;z-index:90;padding:8px 14px;font-size:13px;background:#14110d;color:#ecd9a0;border:1px solid #c9a45c;box-shadow:0 4px 18px rgba(0,0,0,.4);max-width:calc(100vw - 24px)';document.body.appendChild(el)}
    const n=Net.pend;
    if(Net.off){el.hidden=false;el.textContent='Sin conexión · trabajando sin internet'+(n?' · '+plr(n,'cambio','cambios')+' por enviar':'')}
    else if(n>0){el.hidden=false;el.textContent='Sincronizando…'}
    else el.hidden=true;
  },
  refresh(){
    renderBell();
    const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if(typing||UI.confirm)return;
    if(UI.modal){if(['invoice','credit'].includes(UI.modal.t)){UI.modal.keep=1;renderOverlay()}return}
    if(UI.view==='panel')renderPC();else render();
  },
  async flush(){
    if(Net.busy){Net.again=true;return}
    Net.busy=true;let retry=false;
    try{
      const ops=Net.ops().slice(0,25);
      if(ops.length){
        const r=await Net.api('api/ops',{ops});
        Net.apply(r.results.map(x=>({col:x.col,id:x.id,doc:x.doc})));
        S.counter=Math.max(S.counter||0,r.counter||0);
        const bad=r.results.find(x=>!x.ok);if(bad)toast(bad.error||'No se pudo guardar');
        Net.refresh();
      }
    }catch(e){
      if(e.status===401||e.status===403){toast(e.message)}else{if(e.status!==0)toast('El servidor no respondió. Reintentando…');retry=true}
    }
    Net.busy=false;
    try{Net.pend=Net.ops().length}catch(x){}Net.chip();Net.snap();
    if(!retry&&Net.pend>0&&Net.loop++<400){clearTimeout(Net.timer);Net.timer=setTimeout(Net.flush,60)}else if(!Net.pend)Net.loop=0;
    if(retry){clearTimeout(Net.timer);Net.timer=setTimeout(Net.flush,5000)}
    else if(Net.again){Net.again=false;Net.touch()}
  },
  async pull(){
    if(Net.busy||Net.pulling||Net.timer&&Net.ops().length)return;
    Net.pulling=true;
    try{
      const j=await Net.api('api/sync?since='+Net.rev);
      const sess=j.me&&j.me.kind==='user'?j.me.id:null,cs=j.me&&j.me.kind==='customer'?j.me.id:null;
      if(sess!==S.session||cs!==S.custSession){await Net.reset(j.me);UI.view=S.session?'panel':'store';UI.tab=null;UI.modal=null;render();return}
      const old=new Set(S.notifs.map(n=>n.id));
      const n=Net.apply(j.changes);Net.rev=j.rev;S.counter=Math.max(S.counter||0,j.counter||0);
      const b=inbox();
      S.notifs.filter(x=>x.to===b&&!x.read&&!old.has(x.id)&&!shown.has(x.id)).reverse().forEach(x=>{shown.add(x.id);pushBanner(x)});
      if(n){Net.refresh();Net.snap()}else renderBell();
    }catch(e){}
    Net.pulling=false;
  },
  async reset(me){
    const j=await Net.api('api/sync?since=0');
    for(const c of NCOLS)S[c]=[];S.settings={};
    Net.base={};Net.apply(j.changes);Net.setMe(j.me||me);Net.rev=j.rev;S.counter=j.counter;
    migrate();Net.rebase();S.notifs.forEach(n=>shown.add(n.id));
    const r=S.ref&&S.ref.code;if(r&&!S.users.some(x=>String(x.code).toUpperCase()===r.toUpperCase())){try{const x=await Net.api('api/ref?code='+encodeURIComponent(r));if(x.user)S.users.push(x.user);else S.ref=null}catch(e){}}
    Net.saveLocal();Net.pend=0;Net.chip();Net.snap();
  },
  async login(user,h){await Net.api('api/login',{user,h});await Net.reset()},
  async register(b){await Net.api('api/register',b);await Net.reset()},
  async logout(){
    let ok=true;try{await Net.api('api/logout',{})}catch(e){ok=false}
    if(ok){try{localStorage.removeItem('gt-logout')}catch(e){}try{await Net.reset()}catch(e){ok=false}}
    if(!ok){ // sin internet: se cierra la sesión aquí y se avisa al servidor cuando vuelva
      try{localStorage.setItem('gt-logout','1')}catch(e){}
      Net.setMe(null);for(const c of ['users','customers','orders','creditReqs','notifs','cashClosings','coupons','carts','costs'])S[c]=[];Net.rebase();Net.snap();
    }
    UI.view='store';UI.tab=null;UI.modal=null;render();
  },
  async finishLogout(){try{await Net.api('api/logout',{});localStorage.removeItem('gt-logout');await Net.reset()}catch(e){}},
  listen(){
    if(Net.rt==='ws'){
      let tries=0;const open=()=>{try{
        const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+location.pathname.replace(/[^\/]*$/,'')+'api/ws');
        ws.onopen=()=>{tries=0;Net.ws=ws;Net.pull()};
        ws.onmessage=e=>{if(e.data!=='pong')Net.pull()};
        ws.onclose=()=>{Net.ws=null;setTimeout(open,Math.min(30000,1000*Math.pow(2,tries++)))};
      }catch(e){}};open();
      setInterval(()=>{try{Net.ws&&Net.ws.send('ping')}catch(e){}},30000);
    }else if(Net.rt!=='poll'){try{Net.es=new EventSource('api/events');Net.es.onmessage=()=>Net.pull()}catch(e){}}
    setInterval(Net.pull,Net.rt==='poll'?7000:20000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)Net.pull()});
    addEventListener('online',()=>{Net.off=true;Net.setOff(false);Net.pull()});
    addEventListener('offline',()=>Net.setOff(true));
  }
};
async function bootApi(online){
  const loc=Net.localGet();
  S={v:2,counter:100,session:null,custSession:null,ref:loc.ref||null,cart:loc.cart||[],prefs:loc.prefs||{},favs:loc.favs||{},settings:{}};
  for(const c of NCOLS)S[c]=[];
  let sn=null;try{sn=await IDB.get('snap')}catch(e){}
  if(sn&&sn.v===1&&sn.cols){Net.restore(sn)}else sn=null;
  if(online){
    try{
      if(!sn)await Net.reset();
      else{
        let lo=false;try{lo=!!localStorage.getItem('gt-logout')}catch(e){}
        if(lo)await Net.finishLogout();
        else{await Net.flush();await Net.pull()}
      }
    }catch(e){}
  }
  if(S.ref&&Date.now()-S.ref.ts>30*864e5)S.ref=null;
  if(S.session&&!me())S.session=null;
  UI.view=S.session?'panel':'store';if(UI.view==='panel')UI.tab=null;
  UI.persist=true;
  if(!online)Net.setOff(true);
  Net.pend=Net.ops().length;Net.chip();
  await cfgLoad();
  render();readHash();Net.listen();
}
async function detectApi(){
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),2500);const r=await fetch('api/ping',{signal:c.signal,cache:'no-store'});clearTimeout(t);if(!r.ok){try{const e=await r.json();if(e&&e.app==='golden-touch'&&e.dberror)window.GT_DBERR=e.error||'sin conexión'}catch(_){}return false}const j=await r.json();Net.rt=j&&j.rt;const ok=!!(j&&j.app==='golden-touch');if(ok){try{localStorage.setItem('gt-api','1');localStorage.setItem('gt-rt',Net.rt||'')}catch(e){}}return ok}catch(e){return false}
}
(async function boot(){
  if(await detectApi()){API=true;await bootApi(true);return}
  if(window.GT_DBERR){document.body.innerHTML='<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:Georgia,serif;color:#e8dcc0;background:#0b0a08;border:1px solid #c9a45c;text-align:center"><h2 style="font-weight:400;color:#c9a45c">La tienda no puede conectarse a la base de datos</h2><p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6">Revisa los datos de MySQL en <b>api/config.php</b> (nombre, usuario y contraseña de la base de datos) y abre <b>/api/check.php</b> para ver el diagnóstico.</p><p style="font-family:Arial,sans-serif;font-size:12px;opacity:.7">'+String(window.GT_DBERR).replace(/[<>&]/g,'')+'</p></div>';return}
  let was=false;try{was=localStorage.getItem('gt-api')==='1'&&!!(await IDB.get('snap'))}catch(e){}
  if(was){API=true;try{Net.rt=localStorage.getItem('gt-rt')||undefined}catch(e){}await bootApi(false);return}
  try{S=await IDB.get('state')}catch(e){S=null;UI.persist=false}
  if(!S||!S.v)await seed();
  migrate();
  await cfgLoad();
  S.notifs.forEach(n=>shown.add(n.id));
  if(S.ref&&Date.now()-S.ref.ts>30*864e5)S.ref=null;
  if(S.session&&!me())S.session=null;
  if(S.custSession&&!cust())S.custSession=null;
  UI.view=S.session?'panel':'store';
  if(UI.view==='panel')UI.tab=null;
  render();readHash();
})();
</script>

<div id="pwabar" class="pwabar" hidden role="region" aria-label="Instalar la aplicación">
  <img src="icons/icon-192.png" alt="" width="40" height="40">
  <div class="pwatx"><b>Instala GOLDEN TOUCH</b><span id="pwahint">Ábrela como app desde tu pantalla de inicio.</span></div>
  <button class="btn sm" id="pwainstall" type="button">Instalar</button>
  <button class="x" id="pwaclose" type="button" aria-label="Cerrar">×</button>
</div>
<style>
.pwabar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line2);padding:10px 8px 10px 12px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.pwabar img{border-radius:9px;flex:none}.pwatx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pwatx b{font-family:var(--f-display);font-weight:500;font-size:18px}.pwatx span{font-size:12.5px;color:var(--muted)}
</style>
<script>
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  var bar=document.getElementById('pwabar'),btn=document.getElementById('pwainstall'),hint=document.getElementById('pwahint'),deferred=null;
  function dismissed(){try{return Date.now()-(+localStorage.getItem('gt-pwa-x')||0)<7*864e5}catch(e){return false}}
  function show(){if(!standalone&&!dismissed()&&window.top===window)bar.hidden=false}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;show()});
  addEventListener('appinstalled',function(){bar.hidden=true;deferred=null});
  if(ios&&!standalone){hint.textContent='En Safari toca Compartir y elige “Añadir a pantalla de inicio”.';btn.hidden=true;setTimeout(show,2500)}
  btn.addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;bar.hidden=true})});
  document.getElementById('pwaclose').addEventListener('click',function(){bar.hidden=true;try{localStorage.setItem('gt-pwa-x',String(Date.now()))}catch(e){}});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')&&window.top===window){
    addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
  addEventListener('offline',function(){if(window.toast)toast('Sin conexión. Puedes seguir viendo la tienda')});
  addEventListener('online',function(){if(window.toast)toast('Conexión restablecida')});
})();
</script>
